[project]
name = "tuneapi"
version = "9.0.0"
description = "A swiss knife python package for building application with LLMs. Very opinionated."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yash Bonde" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["llm", "api", "ai", "machine-learning", "language-models"]
dependencies = [
    "cachetools>=7.1.7",
    "cloudpickle>=3.1.2",
    "cryptography>=50.0.0",
    "nutree>=1.1.0",
    "openai>=3.0.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "snowflake-id>=1.0.2",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
boto3 = ["boto3>=1.43.69"]
all = ["boto3>=1.43.69"]

[project.urls]
Homepage = "https://github.com/yashbonde/tuneapi"
Repository = "https://github.com/yashbonde/tuneapi.git"
Documentation = "https://github.com/yashbonde/tuneapi#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Nothing published in the last three days is a resolution candidate. A release
# that is broken, yanked or compromised is usually caught within a day or two,
# and this package has no reason to be the one that finds out first. It is a
# rolling window, so it needs no maintenance -- but it does mean a fix
# published today will not be picked up until Thursday.
exclude-newer = "3 days"

[dependency-groups]
dev = [
    "sphinx==7.2.5",
    "sphinx_rtd_theme==1.3.0",
    "poetry==1.6.1",
    "twine>=6.1.0",
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
]
